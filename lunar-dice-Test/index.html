<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LUNAR DICE – Design-Test 0.1</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#020717;color:#ffe2a4;font-family:Georgia,serif;overflow:hidden}body{display:grid;place-items:center}.stage{position:relative;width:min(100vw,177.68vh);aspect-ratio:1672/941;background:url('assets/table.jpg') center/100% 100% no-repeat;overflow:hidden;border:1px solid #b78845}.stage:after{content:'';pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 30px #000}
.dice{position:absolute;inset:30% 29% 26% 29%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:3%}.die{border:0;padding:0;position:relative;background:transparent;cursor:pointer;transition:transform .2s,filter .2s;min-width:0;min-height:0}.die img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 5px 8px #000)}.die .symbol{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);font-size:clamp(13px,4.5vh,40px);text-shadow:0 2px 4px #000,0 0 9px #ffc766;background:#07152cbb;border-radius:50%;min-width:1.2em}.die.selected{transform:translateY(-10%);filter:drop-shadow(0 0 12px #ffc24a)}.die.locked{transform:translateY(-10%);filter:drop-shadow(0 0 9px #ffcd55)}.die.locked:after{content:'🔒';position:absolute;right:5%;bottom:5%;font-size:clamp(10px,2vh,20px)}.die.spinning img{animation:spin 2s ease-out}.die.spinning{animation:float 2s ease-out}@keyframes spin{0%{transform:rotate(0)}55%{transform:rotate(580deg)}100%{transform:rotate(720deg)}}@keyframes float{0%,100%{translate:0 0}40%{translate:0 -12%}}
.hud{position:absolute;z-index:2;left:1%;top:37%;width:21%;padding:1%;background:#061329e8;border:1px solid #d6a85b;border-radius:8px;text-align:center;font-size:clamp(10px,2.2vh,22px)}.hud strong{display:block;font-size:clamp(16px,5vh,45px)}.hud small{display:block;font-size:clamp(9px,1.7vh,17px);color:#f6d28a}.buttons{position:absolute;z-index:3;right:1%;top:39%;width:21%;display:grid;gap:1.8vh}button.action{background:linear-gradient(#1e5a98,#061e42);border:2px solid #d7ae65;border-radius:7px;color:#ffe5ae;font:700 clamp(9px,2.2vh,22px) Georgia;padding:1.6vh .5vw;cursor:pointer}button.action.gold{background:linear-gradient(#c3944c,#68401b);color:#100b0a}button:disabled{opacity:.4;cursor:default}.banner{position:absolute;left:24%;right:24%;bottom:7%;text-align:center;background:#020c1ac9;border:1px solid #d1a04e;border-radius:9px;padding:.6vh;font-size:clamp(9px,2vh,20px);z-index:4}.overlay{position:absolute;inset:0;z-index:9;background:#000b;display:none;align-items:center;justify-content:center;text-align:center}.overlay.show{display:flex}.modal{background:#08152bea;border:2px solid #e0b35f;padding:2vw;border-radius:16px;max-width:65%;font-size:clamp(12px,2.7vh,27px)}.modal h2{margin:0 0 1vh}.modal button{margin:1vh;padding:1vh 2vw;background:#bc8e47;border:1px solid #ffdc92;border-radius:8px;font:inherit;cursor:pointer}.badge{position:absolute;right:1%;bottom:1%;z-index:3;font:clamp(8px,1.5vh,15px) Arial;color:#ffe7b0;background:#0009;padding:4px}.info{position:absolute;left:2%;bottom:2%;font-size:clamp(8px,1.8vh,18px);z-index:3;background:#000a;padding:5px} @media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="stage"><div class="hud">GESICHERTE PUNKTE<strong id="bank">0</strong><small>Aktueller Zug: <b id="turn">0</b></small><small>Bei Sicherung: <b id="preview">0</b></small><small id="state">Würfle zum Start!</small></div><section class="dice" id="dice" aria-label="Sechs Würfel"></section><div class="buttons"><button class="action" id="roll">🎲 WÜRFELN</button><button class="action gold" id="confirm" disabled>✓ AUSWAHL HALTEN</button><button class="action gold" id="bankBtn" disabled>💰 PUNKTE SICHERN</button><button class="action" id="reset">↻ NEUSTART</button></div><div class="banner" id="message">LUNAR DICE · Grafik- & Würfeltest</div><div class="info">🌑 0 · 🌙 1 · 🌓 2 · 🌕 3 · ⭐ Spezial · 🌌 Spezial</div><div class="badge">DESIGN-TEST 0.1 · OFFLINE · KEINE PROFILDATEN</div><div class="overlay" id="overlay"><div class="modal"><h2 id="effectTitle"></h2><div id="effectBody"></div><button id="closeEffect">WEITER</button></div></div></main><script>
'use strict';const $=id=>document.getElementById(id),symbols=['🌑','🌙','🌓','🌕','⭐','🌌'],values=[0,1,2,3,0,0];let dice=[],held=[],selected=new Set(),bank=0,turn=0,started=false,busy=false,shield=false,mult=1,rollCount=0;const random=()=>Math.floor(Math.random()*6);const msg=s=>$('message').textContent=s;
function update(){ $('bank').textContent=bank;$('turn').textContent=turn*mult;$('preview').textContent=bank+turn*mult;$('state').textContent=shield?'🛡️ Mondschutz aktiv':mult===2?'🌕 Mondsegen ×2':'Würfe: '+rollCount;$('confirm').disabled=busy||!started||!selected.size;$('bankBtn').disabled=busy||!started||(!turn&&!held.some(Boolean));$('roll').disabled=busy||(started&&!held.some(Boolean));$('roll').textContent=started?'🎲 WEITERWÜRFELN':'🎲 WÜRFELN';}
function paint(){const area=$('dice');area.innerHTML='';dice.forEach((face,i)=>{let b=document.createElement('button');b.className='die'+(held[i]?' locked':'')+(selected.has(i)?' selected':'');b.disabled=busy||held[i]||!started||face===0;b.setAttribute('aria-label',`Würfel ${i+1}: ${symbols[face]}${held[i]?', gehalten':''}`);let im=document.createElement('img');im.src='assets/die'+i+'.png';im.alt='';b.append(im);let s=document.createElement('span');s.className='symbol';s.textContent=symbols[face];b.append(s);b.onclick=()=>{if(selected.has(i))selected.delete(i);else selected.add(i);paint();update()};area.append(b)});update()}
function effect(title,body){$('effectTitle').textContent=title;$('effectBody').textContent=body;$('overlay').classList.add('show')};$('closeEffect').onclick=()=>$('overlay').classList.remove('show');
function finish(bust=false){if(!bust)bank+=turn*mult;turn=0;mult=1;shield=false;started=false;held=Array(6).fill(false);selected.clear();rollCount=0;msg(bust?'🌑 Mondfinsternis – ungesicherte Punkte verloren!':'💰 Punkte gesichert! Nächster Zug bereit.');paint()}
async function roll(){if(busy)return;if(started&&!held.some(Boolean))return;busy=true;selected.clear();started=true;rollCount++;let active=[];for(let i=0;i<6;i++)if(!held[i])active.push(i);if(!active.length){finish();return}for(let i of active)dice[i]=random();paint();active.forEach(i=>$('dice').children[i].classList.add('spinning'));await new Promise(r=>setTimeout(r,2000));busy=false;let zeros=active.filter(i=>dice[i]===0).length;if(zeros>=3){if(shield){shield=false;msg('🛡️ Mondschutz hat die Mondfinsternis abgefangen!');effect('🛡️ MONDSCHUTZ','Der Schutz wurde verbraucht. Deine Punkte bleiben erhalten.');}else{effect('🌑 MONDFINSTERNIS','Drei Neumonde! Ungesicherte Punkte verfallen.');finish(true);return}}else if(active.every(i=>dice[i]===0)){finish();return}else msg('Wähle mindestens einen Würfel zum Halten.');paint()}
function hold(){if(!selected.size)return;const group=[...selected];for(let i of group){held[i]=true;turn+=values[dice[i]]}selected.clear();const count=f=>held.reduce((n,h,i)=>n+(h&&dice[i]===f),0);
// First visual/mechanical test: each combo can trigger once per turn; opponent theft and banked-point transfers follow in multiplayer version.
if(count(1)>=3&&!shield){shield=true;turn+=10;effect('🛡️ MONDSCHUTZ','+10 Rundenpunkte und Schutz vor einer Mondfinsternis.');}
if(count(3)>=3&&mult===1){mult=2;effect('🌕 MONDSEGEN','Deine Rundenpunkte werden verdoppelt.');}
if(count(4)>=3){effect('⭐ STERNENRAUB','Die Gegner-Auswahl und der Punkte-Transfer folgen mit dem Mehrspieler-Modus.');}
if(count(5)>=2){effect('🌌 KOSMISCHER TAUSCH','Die Auswahl +20 Punkte oder 10 Punkte stehlen folgt mit dem Mehrspieler-Modus.');}
if(held.every(Boolean)){finish();return}msg('Würfel gehalten. Du kannst erneut würfeln oder Punkte sichern.');paint()}
$('roll').onclick=roll;$('confirm').onclick=hold;$('bankBtn').onclick=()=>finish();$('reset').onclick=()=>{bank=0;turn=0;mult=1;shield=false;started=false;busy=false;held=Array(6).fill(false);selected.clear();dice=Array.from({length:6},random);rollCount=0;msg('Neue Testpartie bereit.');paint()};$('reset').click();
</script></body></html>
