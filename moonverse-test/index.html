</section><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const key='moonverse_profile_name_v1';const safeName=()=>{try{return localStorage.getItem(key)||'Spieler'}catch{return 'Spieler'}};const setName=n=>{try{localStorage.setItem(key,n)}catch{}};function refresh(){$('playerName').textContent=safeName();$('playerLevel').textContent='Lade Level …';}function show(title,html){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialog').classList.add('open')}function close(){$('dialog').classList.remove('open')}function profile(){show('👤 MOONVERSE-Profil','<p>Dein Name für dieses MOONVERSE-Menü:</p><form id="nameForm"><input id="nameInput" maxlength="18" required aria-label="Spielername"><br><button type="submit">Namen speichern</button></form><p class="note">Name, Avatar und MOONVERSE-XP werden aus deinem KABOOM!-Profil übernommen.</p>');$('nameInput').value=safeName();$('nameForm').addEventListener('submit',e=>{e.preventDefault();const n=$('nameInput').value.trim();if(n){setName(n);refresh();close()}})}const gameView=$('gameView'),gameFrame=$('kaboomFrame');
function openKaboom(){
 gameView.classList.add('open');
 if(!gameFrame.getAttribute('src'))gameFrame.src='../v22-test/';
}
function closeKaboom(){
 gameView.classList.remove('open');
 // Reload on the next visit so completed-game XP is reflected in the hub.
 // Firebase listener remains active while the frame is open.
}
$('returnMoonverse').addEventListener('click',closeKaboom);
const future={constellation:'CONSTELLATION',lunar:'LUNAR DICE',orbit:'ORBIT',eclipse:'ECLIPSE'};document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{const a=b.dataset.action;if(a==='kaboom'){openKaboom();return}if(a==='profile'){profile();return}if(future[a]){show(future[a],'🌙 Dieses Spiel ist noch in Entwicklung.<p>Demnächst im MOONVERSE!</p>');return}if(a==='stats'){show('📊 Statistiken','Die gemeinsamen MOONVERSE-Statistiken werden später angebunden.<p>Deine bisherigen KABOOM!-Statistiken bleiben im KABOOM!-Profil.</p>');return}if(a==='achievements'){window.openMoonverseAchievements?.();return}if(a==='settings'){show('⚙️ Einstellungen','MOONVERSE-Einstellungen folgen in einer späteren Version.');return}if(a==='invite'){const link=location.href.split('?')[0];if(navigator.share){try{await navigator.share({title:'MOONVERSE',url:link})}catch{}}else{show('👥 Freunde einladen','<p>Teile diese Adresse mit deinen Freunden:</p><p id="inviteLink" style="overflow-wrap:anywhere"></p>');$('inviteLink').textContent=link}}}));$('close').onclick=close;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});refresh();})();
</script><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getAuth,onAuthStateChanged,signInAnonymously} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';
import {getDatabase,ref,onValue} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const config={apiKey:'AIzaSyBC6OgylLUwYfkYh7EUIImdFCE_f-icexY',authDomain:'kaboom-online-888e6.firebaseapp.com',databaseURL:'https://kaboom-online-888e6-default-rtdb.europe-west1.firebasedatabase.app',projectId:'kaboom-online-888e6',storageBucket:'kaboom-online-888e6.firebasestorage.app',messagingSenderId:'20236908178',appId:'1:20236908178:web:bfab106f472f3965f9d84b'};
const thresholds=[0,100,250,450,700,1000,1350,1750,2200,2700,3300,4000,4800,5700,6700,7800,9000,10300,11700,13200,14800,16500,18300,20200,22200,24400,26800,29400,32200,35200,38400,41800,45400,49200,53200,57400,61800,66400,71200,76200,81400,86800,92400,98200,104200,110400,116800,123400,130200,137200];
const ranks=['Sternenstaub','Sternensucher','Mondwanderer','Nachtjäger','Sternenwächter','Nebelphantom','Galaxienritter','Kosmischer Wächter','Herrscher der Sterne','Legende des Moonverse'];
const el=id=>document.getElementById(id);
function paint(profile){
 const xp=Math.max(0,Number(profile?.stats?.moonverse?.xp)||0);
 const level=Math.max(1,thresholds.findLastIndex(t=>xp>=t)+1);
 const next=thresholds[level];const prev=thresholds[level-1];
 const pct=next===undefined?100:Math.min(100,Math.max(0,100*(xp-prev)/(next-prev)));
 el('playerLevel').textContent='Level '+level+' · '+ranks[Math.floor((level-1)/5)];
 el('xpFill').style.width=pct+'%';
 el('xpDetail').textContent=next===undefined?xp.toLocaleString('de-DE')+' XP · MAX':xp.toLocaleString('de-DE')+' / '+next.toLocaleString('de-DE')+' XP';
 const name=profile?.identity?.name;
 if(name){el('playerName').textContent=name;try{localStorage.setItem('moonverse_profile_name_v1',name)}catch{}}
 const allowedAvatars=['lion','owl','wolf','cat','fox','stag','bear','raven'];
 const avatar=allowedAvatars.includes(profile?.identity?.avatar)?profile.identity.avatar:null;
 const portrait=el('playerAvatar');
 if(avatar){
   portrait.onerror=()=>{portrait.hidden=true;console.warn('Avatar-Bild fehlt:',portrait.src)};
   portrait.src='../v22-test/assets/avatar-'+avatar+'.webp';
   portrait.hidden=false;
 }else{portrait.hidden=true;portrait.removeAttribute('src')}
 window.moonverseSharedProfile=profile;
}
function error(message){el('playerLevel').textContent='Profil nicht verbunden';el('xpDetail').textContent=message;}
try{
 const app=initializeApp(config);const auth=getAuth(app),db=getDatabase(app);
 let unsubscribe=null,activeUid=null;
 onAuthStateChanged(auth,async user=>{
  if(!user){try{await signInAnonymously(auth)}catch(e){console.error(e);error('Firebase-Anmeldung fehlgeschlagen')}return;}
  if(activeUid===user.uid)return;
  activeUid=user.uid;if(unsubscribe)unsubscribe();
  unsubscribe=onValue(ref(db,'profiles/'+user.uid),snap=>paint(snap.val()||{}),e=>{console.error(e);error('Datenbankzugriff prüfen')});
 });
}catch(e){console.error(e);error('Firebase konnte nicht geladen werden')}
</script><script id="moonverse-achievements-collection">
(()=>{
'use strict';
const catalog=[
['Mondmeister','Gewinne eine Partie mit 0 Gesamtpunkten.'],
['Sternendieb','Tausche erfolgreich mit einer 11 oder 12.'],
['Lunar-Scout','Sieh dir 10 gegnerische Karten an.'],
['KABOOM!-Legende','Rufe 25-mal korrekt KABOOM!.'],
['Phönix der Nacht','Gewinne nach mindestens 15 Punkten Rückstand.'],
['Sternenkönig','Gewinne 50 Partien.'],
['Kartenleser','Sieh dir 50 gegnerische Karten an.'],
['Geschickter Fuchs','Führe 25 erfolgreiche Blindtausche aus.'],
['Rudelspieler','Spiele 100 Partien.'],
['Comeback-König','Gewinne nach einer Runde mit mindestens 10 Punkten.'],
['Nerven aus Stahl','Rufe 10-mal korrekt KABOOM! mit genau zwei Nullen.'],
['Konstanz','Gewinne fünf Partien hintereinander.']];
function progress(s){return [[s.moonMaster?1:0,1],[s.swaps||0,1],[s.opponentPeeks||0,10],[s.correctKaboom||0,25],[s.phoenix?1:0,1],[s.wins||0,50],[s.opponentPeeks||0,50],[s.swaps||0,25],[s.games||0,100],[s.comeback?1:0,1],[s.doubleZeroCalls||0,10],[s.winStreak||0,5]]}
function render(){
 const p=window.moonverseSharedProfile;
 const stats=p?.stats||{};
 const scores=progress(stats);
 const count=scores.filter(([n,t])=>n>=t).length;
 const panel=document.querySelector('#dialog .panel');panel.classList.add('achievements-panel');
 document.getElementById('dialogTitle').textContent='🏆 MOONVERSE · Erfolge';
 const body=document.getElementById('dialogBody');body.replaceChildren();
 const intro=document.createElement('p');intro.className='mv-ach-intro';intro.textContent=p?'KABOOM! · '+count+' von 12 Erfolgen freigeschaltet':'Verbinde dein Profil …';body.append(intro);
 const tabs=document.createElement('div');tabs.className='mv-ach-tabs';
 for(const [i,name] of ['KABOOM!','CONSTELLATION','LUNAR DICE','ORBIT','ECLIPSE'].entries()){
  const b=document.createElement('button');b.textContent=name+(i?' · Bald':'');b.disabled=i!==0;tabs.append(b);
 }body.append(tabs);
 const grid=document.createElement('div');grid.className='mv-ach-grid';
 catalog.forEach(([name,desc],i)=>{
  const [current,target]=scores[i];const unlocked=current>=target;
  const card=document.createElement('article');card.className='mv-ach-card '+(unlocked?'unlocked':'locked');
  const img=document.createElement('img');img.src='../v22-test/achievements/'+String(i+1).padStart(2,'0')+'.png';img.alt=name;img.loading='lazy';
  img.onerror=()=>{img.style.display='none'};
  const title=document.createElement('div');title.className='mv-ach-name';title.textContent=(unlocked?'✦ ':'🔒 ')+name;
  const details=document.createElement('div');details.className='mv-ach-desc';details.textContent=desc;
  const status=document.createElement('div');status.className='mv-ach-progress';status.textContent=Math.min(current,target)+' / '+target;
  card.append(img,title,details,status);grid.append(card);
 });body.append(grid);
 document.getElementById('dialog').classList.add('open');
}
window.openMoonverseAchievements=render;
const close=document.getElementById('close');close.addEventListener('click',()=>document.querySelector('#dialog .panel').classList.remove('achievements-panel'));
const observer=new MutationObserver(()=>{const d=document.getElementById('dialog');if(!d.classList.contains('open'))document.querySelector('#dialog .panel').classList.remove('achievements-panel')});observer.observe(document.getElementById('dialog'),{attributes:true,attributeFilter:['class']});
})();
</script></body></html>
