<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#030c23"><title>MOONVERSE – The Celestial Game Collection</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030c23;color:#fbe6b3;font-family:Georgia,serif}body{background:radial-gradient(ellipse at center,#16284b,#020715 85%)}.shell{position:absolute;inset:0;display:grid;place-items:center}.stage{position:relative;width:min(100vw,177.6833vh);aspect-ratio:1672/941;background:url('assets/moonverse-menu.png') center/100% 100% no-repeat;box-shadow:0 0 65px #0009}.hit{position:absolute;display:block;border:0;background:transparent;color:transparent;cursor:pointer;touch-action:manipulation;padding:0}.hit:focus-visible{outline:2px solid #ffe7a5;border-radius:8px;background:#ffd96b22}.hit:active{background:#ffdd7720;border-radius:8px}.profile-name{position:absolute;left:9.8%;top:4.1%;width:14.5%;height:5%;display:flex;align-items:center;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-weight:bold;font-size:clamp(9px,2.6vh,25px);text-shadow:0 1px 3px #000;pointer-events:none}.profile-level{position:absolute;left:10.6%;top:10%;font-size:clamp(8px,1.7vh,16px);color:#e4c27c;pointer-events:none}.xp-mask{position:absolute;left:10.8%;top:12.8%;width:11.2%;height:1.2%;background:#061126;border-radius:30px;pointer-events:none}.dialog{position:fixed;inset:0;background:#020713c9;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.dialog.open{display:flex}.panel{position:relative;max-width:min(92vw,520px);max-height:90vh;overflow:auto;padding:26px;border:2px solid #d4a85b;border-radius:18px;background:linear-gradient(145deg,#0b1834,#020818);box-shadow:0 0 35px #a7783355;text-align:center}.panel h2{margin:0 0 15px;color:#ffdc8a}.panel p{line-height:1.5}.panel button,.panel input{font:inherit;border-radius:8px;padding:11px;margin:7px}.panel button{background:linear-gradient(#d5a756,#815421);border:1px solid #f8d58b;color:#130e0c;cursor:pointer;font-weight:bold}.panel input{max-width:100%;background:#fff;color:#161616;border:2px solid #d4a85b}.close{position:absolute;right:8px;top:4px}.note{font-size:.85em;color:#cbbca4}@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body><main class="shell"><div class="stage" id="stage" aria-label="MOONVERSE Spieleauswahl">
<div class="profile-name" id="playerName">Spieler</div><div class="profile-level" id="playerLevel"></div><div class="xp-mask" aria-hidden="true"></div>
<button class="hit" style="left:1.5%;top:2%;width:24%;height:14%" data-action="profile" aria-label="Spielerprofil"></button>
<button class="hit" style="left:78%;top:2%;width:7%;height:14%" data-action="stats" aria-label="Statistiken"></button>
<button class="hit" style="left:85%;top:2%;width:7%;height:14%" data-action="achievements" aria-label="Erfolge"></button>
<button class="hit" style="left:92%;top:2%;width:7%;height:14%" data-action="settings" aria-label="Einstellungen"></button>
<button class="hit" style="left:7%;top:72%;width:15%;height:9%" data-action="kaboom" aria-label="KABOOM spielen"></button>
<button class="hit" style="left:27%;top:72%;width:13%;height:9%" data-action="constellation" aria-label="Constellation"></button>
<button class="hit" style="left:44%;top:72%;width:13%;height:9%" data-action="lunar" aria-label="Lunar Dice"></button>
<button class="hit" style="left:61%;top:72%;width:13%;height:9%" data-action="orbit" aria-label="Orbit"></button>
<button class="hit" style="left:79%;top:72%;width:13%;height:9%" data-action="eclipse" aria-label="Eclipse"></button>
<button class="hit" style="left:1%;top:86%;width:20%;height:12%" data-action="profile" aria-label="Profil bearbeiten"></button>
<button class="hit" style="left:80%;top:86%;width:19%;height:12%" data-action="invite" aria-label="Freunde einladen"></button>
</div></main><div class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><section class="panel"><button class="close" id="close" aria-label="Schließen">✕</button><h2 id="dialogTitle"></h2><div id="dialogBody"></div></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id);const key='moonverse_profile_name_v1';const safeName=()=>{try{return localStorage.getItem(key)||'Spieler'}catch{return 'Spieler'}};const setName=n=>{try{localStorage.setItem(key,n)}catch{}};function refresh(){$('playerName').textContent=safeName();$('playerLevel').textContent='';}function show(title,html){$('dialogTitle').textContent=title;$('dialogBody').innerHTML=html;$('dialog').classList.add('open')}function close(){$('dialog').classList.remove('open')}function profile(){show('👤 MOONVERSE-Profil','<p>Dein Name für dieses MOONVERSE-Menü:</p><form id="nameForm"><input id="nameInput" maxlength="18" required aria-label="Spielername"><br><button type="submit">Namen speichern</button></form><p class="note">Noch nicht mit dem KABOOM!-Onlineprofil verbunden. Ein gemeinsames Levelsystem kommt später.</p>');$('nameInput').value=safeName();$('nameForm').addEventListener('submit',e=>{e.preventDefault();const n=$('nameInput').value.trim();if(n){setName(n);refresh();close()}})}const future={constellation:'CONSTELLATION',lunar:'LUNAR DICE',orbit:'ORBIT',eclipse:'ECLIPSE'};document.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',async()=>{const a=b.dataset.action;if(a==='kaboom'){location.href='https://bollec6.github.io/kaboom/v22-test/';return}if(a==='profile'){profile();return}if(future[a]){show(future[a],'🌙 Dieses Spiel ist noch in Entwicklung.<p>Demnächst im MOONVERSE!</p>');return}if(a==='stats'){show('📊 Statistiken','Die gemeinsamen MOONVERSE-Statistiken werden später angebunden.<p>Deine bisherigen KABOOM!-Statistiken bleiben im KABOOM!-Profil.</p>');return}if(a==='achievements'){show('🏆 Erfolge','Die bestehenden zwölf KABOOM!-Erfolge bleiben unverändert und sind weiterhin im KABOOM!-Profil sichtbar.');return}if(a==='settings'){show('⚙️ Einstellungen','MOONVERSE-Einstellungen folgen in einer späteren Version.');return}if(a==='invite'){const link=location.href.split('?')[0];if(navigator.share){try{await navigator.share({title:'MOONVERSE',url:link})}catch{}}else{show('👥 Freunde einladen','<p>Teile diese Adresse mit deinen Freunden:</p><p id="inviteLink" style="overflow-wrap:anywhere"></p>');$('inviteLink').textContent=link}}}));$('close').onclick=close;$('dialog').addEventListener('click',e=>{if(e.target===$('dialog'))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});refresh();})();
</script></body></html>
